# SPDX-License-Identifier: MIT
name: Verify Python research portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, pinned
        with:
          python-version: '3.13'
      - name: Run authored tests and integrity checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python verify.py
